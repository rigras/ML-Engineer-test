<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 132" role="img" aria-label="Extract pipeline"><style>text{font-family:"Segoe UI",Arial,sans-serif}.mono{font-family:Consolas,"Courier New",monospace}</style><rect width="100%" height="100%" fill="#ffffff"/>
    <defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2c56c9"/></marker></defs>
    <g font-size="10">
      <rect x="0" y="6" width="108" height="58" rx="6" fill="#fff" stroke="#17202e"/>
      <text x="54" y="26" text-anchor="middle" font-weight="700">1 Validate</text>
      <text x="54" y="41" text-anchor="middle" font-size="8.5" fill="#5b6577">%PDF- signature,</text>
      <text x="54" y="53" text-anchor="middle" font-size="8.5" fill="#5b6577">size, pages, encrypted</text>
      <rect x="122" y="6" width="108" height="58" rx="6" fill="#fff" stroke="#17202e"/>
      <text x="176" y="26" text-anchor="middle" font-weight="700">2 Rasterize</text>
      <text x="176" y="41" text-anchor="middle" font-size="8.5" fill="#5b6577">every page, page 0</text>
      <text x="176" y="53" text-anchor="middle" font-size="8.5" fill="#5b6577">included, at 300 DPI</text>
      <rect x="244" y="6" width="108" height="58" rx="6" fill="#fff" stroke="#17202e"/>
      <text x="298" y="26" text-anchor="middle" font-weight="700">3 OCR</text>
      <text x="298" y="41" text-anchor="middle" font-size="8.5" fill="#5b6577">words + pixel boxes;</text>
      <text x="298" y="53" text-anchor="middle" font-size="8.5" fill="#5b6577">low confidence dropped</text>
      <rect x="366" y="6" width="108" height="58" rx="6" fill="#e8eefc" stroke="#2c56c9"/>
      <text x="420" y="26" text-anchor="middle" font-weight="700">4 Pixels → points</text>
      <text x="420" y="41" text-anchor="middle" font-size="8.5" class="mono">pt = px × 72 / DPI</text>
      <text x="420" y="53" text-anchor="middle" font-size="8.5" fill="#5b6577">once, top-left origin</text>
      <rect x="488" y="6" width="108" height="58" rx="6" fill="#e8eefc" stroke="#2c56c9"/>
      <text x="542" y="26" text-anchor="middle" font-weight="700">5 NER + align</text>
      <text x="542" y="41" text-anchor="middle" font-size="8.5" fill="#5b6577">PERSON char span →</text>
      <text x="542" y="53" text-anchor="middle" font-size="8.5" fill="#5b6577">exact OCR words → box</text>
      <rect x="610" y="6" width="108" height="58" rx="6" fill="#fff" stroke="#17202e"/>
      <text x="664" y="26" text-anchor="middle" font-weight="700">6 Match</text>
      <text x="664" y="41" text-anchor="middle" font-size="8.5" fill="#5b6577">normalized full name,</text>
      <text x="664" y="53" text-anchor="middle" font-size="8.5" fill="#5b6577">score ≥ 0.90</text>
    </g>
    <g stroke="#2c56c9" stroke-width="1.5">
      <line x1="108" y1="35" x2="120" y2="35" marker-end="url(#a2)"/><line x1="230" y1="35" x2="242" y2="35" marker-end="url(#a2)"/>
      <line x1="352" y1="35" x2="364" y2="35" marker-end="url(#a2)"/><line x1="474" y1="35" x2="486" y2="35" marker-end="url(#a2)"/>
      <line x1="596" y1="35" x2="608" y2="35" marker-end="url(#a2)"/>
    </g>
    <!-- example -->
    <rect x="0" y="78" width="718" height="50" rx="6" fill="#f3f5f9"/>
    <g font-size="9">
      <text x="12" y="96" font-weight="700">Real output (company_memo.pdf)</text>
      <text x="12" y="113" class="mono" font-size="8.6">OCR words "Robert", "Chen" + their char offsets in the page text → spaCy PERSON span covers exactly those 2 words</text>
      <text x="12" y="124" class="mono" font-size="8.6">→ union of their boxes → {page_number: 0, x: 59.76, y: 266.88, width: 53.04, height: 7.2} → matches "Robert Chen", score 1.0</text>
    </g>
  </svg>