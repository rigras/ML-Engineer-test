<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" role="img" aria-label="Scaling architecture"><style>text{font-family:"Segoe UI",Arial,sans-serif}.mono{font-family:Consolas,"Courier New",monospace}</style><rect width="100%" height="100%" fill="#ffffff"/>
    <defs><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#17202e"/></marker></defs>
    <g font-size="9.5" text-anchor="middle">
      <rect x="0" y="40" width="88" height="50" rx="6" fill="#e8eefc" stroke="#2c56c9"/>
      <text x="44" y="61" font-weight="700">Client</text><text x="44" y="76" font-size="8.5" fill="#5b6577">upload / poll</text>
      <rect x="112" y="40" width="110" height="50" rx="6" fill="#fff" stroke="#17202e"/>
      <text x="167" y="61" font-weight="700">API</text><text x="167" y="76" font-size="8.5" fill="#5b6577">202 + job id</text>
      <rect x="246" y="8" width="118" height="44" rx="6" fill="#fff" stroke="#17202e"/>
      <text x="305" y="27" font-weight="700">Object storage</text><text x="305" y="41" font-size="8.5" fill="#5b6577">PDF by content hash</text>
      <rect x="246" y="78" width="118" height="44" rx="6" fill="#fff" stroke="#17202e"/>
      <text x="305" y="97" font-weight="700">Queue</text><text x="305" y="111" font-size="8.5" fill="#5b6577">one job per PDF</text>
      <rect x="400" y="62" width="136" height="74" rx="6" fill="#e4f4ea" stroke="#1b7a43"/>
      <rect x="394" y="56" width="136" height="74" rx="6" fill="#e4f4ea" stroke="#1b7a43"/>
      <rect x="388" y="50" width="136" height="74" rx="6" fill="#fff" stroke="#1b7a43"/>
      <text x="456" y="72" font-weight="700" fill="#1b7a43">OCR workers × N</text>
      <text x="456" y="87" font-size="8.5" fill="#5b6577">autoscale on queue depth</text>
      <text x="456" y="100" font-size="8.5" fill="#5b6577">pages in parallel</text>
      <text x="456" y="113" font-size="8.5" fill="#5b6577">OCR cache by hash</text>
      <rect x="566" y="8" width="152" height="50" rx="6" fill="#fff" stroke="#17202e"/>
      <text x="642" y="28" font-weight="700">Results DB</text><text x="642" y="43" font-size="8.5" fill="#5b6577">names + boxes per job</text>
      <rect x="566" y="74" width="152" height="50" rx="6" fill="#fff" stroke="#17202e"/>
      <text x="642" y="94" font-weight="700">Vector DB service</text><text x="642" y="109" font-size="8.5" fill="#5b6577">native hybrid (Qdrant)</text>
    </g>
    <g stroke="#17202e">
      <line x1="88" y1="65" x2="110" y2="65" marker-end="url(#a4)"/>
      <line x1="222" y1="55" x2="244" y2="32" marker-end="url(#a4)"/>
      <line x1="222" y1="75" x2="244" y2="98" marker-end="url(#a4)"/>
      <line x1="364" y1="100" x2="386" y2="92" marker-end="url(#a4)"/>
      <line x1="364" y1="30" x2="386" y2="62" marker-end="url(#a4)" stroke-dasharray="3 2"/>
      <line x1="524" y1="70" x2="564" y2="38" marker-end="url(#a4)"/>
      <line x1="524" y1="100" x2="564" y2="99" marker-end="url(#a4)"/>
    </g>
    <text x="0" y="146" font-size="8.5" fill="#5b6577">Also: GPU or hosted reranker/embedder · paid LLM tier with concurrency sized to its rate limit · OpenTelemetry traces per stage · lower DPI (200) as a speed/accuracy knob.</text>
  </svg>